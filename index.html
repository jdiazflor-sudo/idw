<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas Académicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2>Gestor de Tareas Universitarias</h2>

        <!-- Contenedor para alertas dinámicas -->
        <div id="alert-container"></div>

        <!-- Formulario con múltiples campos -->
        <form id="task-form" class="mb-3">
            <div class="mb-3">
                <label for="input-titulo" class="form-label">Título de la Tarea</label>
                <input type="text" id="input-titulo" class="form-control" autocomplete="off">
            </div>
            <div class="mb-3">
                <label for="input-curso" class="form-label">Curso</label>
                <input type="text" id="input-curso" class="form-control" autocomplete="off">
            </div>
            <div class="mb-3">
                <label for="input-fecha" class="form-label">Fecha de Entrega</label>
                <input type="date" id="input-fecha" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Agregar Tarea</button>
        </form>

        <!-- Filtros Visuales exigidos por la guía -->
        <div class="btn-group mb-3" role="group">
            <button type="button" class="btn btn-outline-secondary filter-btn active" data-filter="todas">Todas</button>
            <button type="button" class="btn btn-outline-secondary filter-btn" data-filter="pendientes">Pendientes</button>
            <button type="button" class="btn btn-outline-secondary filter-btn" data-filter="completadas">Completadas</button>
        </div>

        <ul id="task-list" class="list-group"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
