<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Académico - Landing Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <!-- Menu de Navegacion -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Portal Académico</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#cursos">Cursos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#noticias">Noticias</a></li>
                </ul>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">Iniciar Sesión</button>
                    <button class="btn btn-light text-primary btn-sm fw-semibold">Registrarse</button>
                </div>
            </div>
        </div>
    </nav>
    <!-- Seccion principal -->
    <header class="hero-section container py-5 my-4">
        <div class="row align-items-center">
            <div class="col-lg-6 hero-text mb-4 mb-lg-0">
                <h1 class="display-4 fw-bold text-dark mb-3">Impulsa tu futuro profesional con nosotros</h1>
                <p class="lead text-secondary mb-4">Accede a una educación moderna, flexible y adaptada a las demandas del mercado tecnológico actual. Aprende con expertos.</p>
                <a href="#cursos" class="btn btn-primary btn-lg">Explorar Cursos</a>
            </div>
            <div class="col-lg-6 hero-image text-center">
                <img src="https://dondeestudiar.pe/wp-content/uploads/2023/01/universidad-UNSA.jpg" alt="Estudiantes universitarios" class="img-fluid rounded shadow-lg">
            </div>
        </div>
    </header>

</body>
</html>
