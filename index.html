<!DOCTYPE html>
<html>
<body>
<h2>Formulario Universitario</h2>
<p>Querido estudiante universitario llene el siguiente formulario</p>
    <form>
    <fieldset>
        <legend>Datos del Alumno</legend>

        <label for="fname">Nombres:</label><br>
        <input type="text" id="fname" name="fname" value=""><br>


        <label for="lname">Apellidos:</label><br>
        <input type="text" id="lname" name="lname" value=""><br>


        <label for="pemail">Correo Electronico:</label><br>
        <input type="email" id="pemail" name="pemail" value=""><br>        
    </fieldset>
    <fieldset>
        <legend> Codigo y Contraseña</legend>


        <label for="code">Codigo:</label><br>
        <input type="text" id="code" name="code" value="" minlength = "8" maxlength="8"
        pattern="[0-9]{8}"><br>


        <label for="contra">Contraseña:</label><br>
        <input type="password" id="contra" name="contra" value=""
        patter="(?=.*\d)(?=.*[A-Z].).{8,}"><br>
    </fieldset>
            <input type="submit" value="Submit">
    </form>
</body>
</html>
